# simdrv: a thin driver for the official WireScript simulator.
# It links the simulator crates from the sibling checkout (same recipe
# `extras/screen/mkwall` uses) and speaks JSON lines over stdin/stdout so
# the Python harness can feed ports, sample per tick, and census a graph.
[package]
name = "simdrv"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
wirescript = { path = "../../../wirescript/crates/wirescript", features = ["brdb-full"] }
wirescript-ir = { path = "../../../wirescript/crates/wirescript-ir", default-features = false }
wirescript-sim = { path = "../../../wirescript/crates/wirescript-sim", features = ["compile"] }
brdb = { version = "1.0.0", default-features = false, features = ["brz"] }
serde_json = "1"

[profile.release]
opt-level = 2
